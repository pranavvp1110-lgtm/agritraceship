[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/iot/sensor-data"
  to = "/.netlify/functions/sensor-data"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
